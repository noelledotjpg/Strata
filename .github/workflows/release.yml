name: Release

on:
  push:
    tags:
      - "v*"          # e.g. v1.0.0 -> builds and publishes a GitHub release
  workflow_dispatch:  # manual run: builds the packages and creates a DRAFT release
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (the release is tagged v<version>)"
        required: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows }
          - { runner: ubuntu-latest,  platform: linux }
          # macOS is disabled for now. LWJGL 2.9.3 only ships x86_64 macOS natives, so if you
          # re-enable it, build on an Intel runner:
          # - { runner: macos-15-intel, platform: macos }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app image
        run: |
          chmod +x gradlew
          ./gradlew packageApp -PappVersion="${{ steps.version.outputs.value }}"

      - name: Create archive
        env:
          ARCHIVE: Strata-${{ steps.version.outputs.value }}-${{ matrix.platform }}-x64
        run: |
          mkdir -p dist
          cd build/package
          case "${{ matrix.platform }}" in
            windows) 7z a -tzip "$GITHUB_WORKSPACE/dist/$ARCHIVE.zip" Strata ;;
            linux)   zip -r -y "$GITHUB_WORKSPACE/dist/$ARCHIVE.zip" Strata ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use their own tag. Manual runs create v<version> and keep the release
          # as a draft, so you can set "pre-release" etc. and publish it from the Releases page.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: dist/*.zip
          generate_release_notes: true